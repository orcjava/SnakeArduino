<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>משחק סנייק</title>
  <style>
    body{
      direction: rtl;
      font-size: 30px;
      background-color: yellow;
    }
    .greenText{
      background-color: lightgreen;
      width: 80%;
      margin-right: 10%;
      margin-top: 30px;
      padding: 10px;
      text-align: center;
    }
    .gridPanel{
      width: 200px;
      position: fixed;
      top: 150px;
      right: 10px;
      background-color: lightblue;
      border-radius: 10px;
      padding: 10px;
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(4,1fr);
    }
    .fullLine{
      grid-column: 2/span 2;
    }
    .halfLine1{
      grid-column: 1/span 2;
    }
    .halfLine2{
      grid-column: 3/span 2;
    }
    #scorePanel{
      position: fixed;
      top: 300px;
      right: 100px;
      font-size: 40px;
    }
    td{
      height: 20px;
      width: 20px;
      border: 1px solid black;
      background-color: white;
    }
    table{margin: 0 auto; }
    #gameBoard{
      margin: 0 auto;
      width: 600px;
      display: grid;
      grid-template-columns: repeat(20,30px);
      grid-template-rows: repeat(20,30px);
      background-color: white;
    }
    #gameBoard div{
      border: 1px solid black;
    }
    .food{
      background-color: red ;
    }
    .snake{
      background-color: lightskyblue ;
    }
    .snakeHead{
      background-color: #129ff6;
    }
    .connect-btn {
      display: block;
      margin: 20px auto;
      padding: 10px;
      font-size: 18px;
      background-color: #129ff6;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
<h1 class="greenText">
  משחק סנייק
</h1>
<div class="greenText" id="gameStartMsg">
  נא ללחוץ כדי להתחיל את המשחק
  <br />
  <button onclick="startNewGame();">
    להתחלת משחק חדש
  </button>
</div>

<button id="connectBtn" class="connect-btn">🔌 לחצו לחיבור הג'ויסטיק למשחק</button>

<div class="buttonsPanel gridPanel">
  <button class="fullLine "  onclick="SetDirection('up');">למעלה</button>
  <button class="halfLine1"  onclick="SetDirection('right');">ימינה</button>
  <button class="halfLine2"  onclick="SetDirection('left');">שמאלה</button>
  <button class="fullLine "  onclick="SetDirection('down');">למטה</button>
</div>
<div id="scorePanel">0</div>
<div id="gameBoard"></div>
<script>
  let score = 0;
  let removeTailCnt=0;
  const CellValues={
    EMPTY:0,
    FOOD:5,
    SNAKE:2,
    SNAKE_HEAD:4,
  }
  let direction="";
  let numOfCols=20;
  let numOfRows=20;
  let timeId;
  let gameOver=false;
  let snake;
  let board=[];
  let writer = null;

  function startNewGame(){
    score = 0;
    removeTailCnt=0;
    direction="";
    gameOver=false;
    board=[];
    createBoard();
    InitSnake();
    AddFood();
    showBoardWithDiv();
    document.getElementById("gameStartMsg").style.display="none";
    if (timeId) clearTimeout(timeId);
    timeId = setTimeout(move, 500)
  }
  function createBoard(){
    for(let i=0;i<numOfRows;i++){
      board[i]=[];
      for(let j=0;j<numOfCols;j++){
        board[i].push(CellValues.EMPTY);
      }
    }
  }
  function AddFood(){
    let row,col;
    do {
      col = Math.floor(Math.random() * numOfCols);
      row = Math.floor(Math.random() * numOfRows);
    }while(board[row][col] !== CellValues.EMPTY);
    board[row][col]=CellValues.FOOD;
  }
  function showBoardWithDiv(){
    let brd=document.getElementById("gameBoard");
    brd.innerHTML="";
    for(let r=0;r<numOfRows;r++){
      for(let c=0;c<numOfCols;c++){
        let el=document.createElement("div");
        switch (board[r][c]) {
          case CellValues.SNAKE:      el.classList.add("snake");      break;
          case CellValues.SNAKE_HEAD: el.classList.add("snakeHead");  break;
          case CellValues.FOOD:       el.classList.add("food");       break;
        }
        brd.appendChild(el);
      }
    }
  }
  function InitSnake(){
    board[5][2]=CellValues.SNAKE_HEAD;
    board[5][1]=CellValues.SNAKE;
    board[5][0]=CellValues.SNAKE;
    snake=
            [
              {r:5,c:2},
              {r:5,c:1},
              {r:5,c:0}
            ];
  }
  function FoodEaten(){
    removeTailCnt=3;
    score+=10;
    AddFood();
    document.getElementById("scorePanel").innerHTML=score;
  }
  function GenStep(newRow,newCol,head){
    if (board[newRow][newCol]===CellValues.FOOD) {
      FoodEaten();
    }
    if (removeTailCnt === 0){
      let tail = snake.pop();
      board[tail.r][tail.c] = CellValues.EMPTY;
    } else {
      removeTailCnt--;
    }
    if ((board[newRow][newCol]===CellValues.SNAKE)||
            (board[newRow][newCol]===CellValues.SNAKE_HEAD)){
      endGame();
      return;
    }
    snake.unshift({r:newRow,c:newCol});
    board[newRow][newCol]=CellValues.SNAKE_HEAD;
    board[head.r][head.c]=CellValues.SNAKE;
  }
  function moveLeft(){
    let head=snake[0];
    let newCol=head.c-1;
    let newRow=head.r;
    if (newCol < 0) {
      endGame()
    } else {
      GenStep(newRow,newCol,head);
    }
  }
  function moveRight(){
    let head=snake[0];
    let newCol=head.c+1;
    let newRow=head.r;
    if (newCol>=numOfCols) {
      endGame()
    } else {
      GenStep(newRow,newCol,head);
    }
  }
  function moveUp(){
    let head=snake[0];
    let newCol=head.c;
    let newRow=head.r-1;
    if (newRow < 0) {
      endGame()
    } else {
      GenStep(newRow,newCol,head);
    }
  }
  function moveDown(){
    let head=snake[0];
    let newCol=head.c;
    let newRow=head.r+1;
    if (newRow >= numOfRows) {
      endGame()
    } else {
      GenStep(newRow,newCol,head);
    }
  }
  function move(){
    if (direction !== "") {
      switch (direction) {
        case "up":    moveUp();     break;
        case "right": moveRight();  break;
        case "left":  moveLeft();   break;
        case "down":  moveDown();   break;
      }
      showBoardWithDiv();
    }
    if (!gameOver) {
      timeId = setTimeout(move, 500)
    }
  }
  function SetDirection(newDirection){
    if (direction === "") {
      direction = newDirection;
      return;
    }
    if (direction === "left" && newDirection === "right") return;
    if (direction === "right" && newDirection === "left") return;
    if (direction === "up" && newDirection === "down") return;
    if (direction === "down" && newDirection === "up") return;
    direction=newDirection;
  }
  function endGame(){
    document.getElementById("gameStartMsg").style.display="block";
    clearTimeout(timeId);
    gameOver=true;
    if (writer) {
      writer.write("GAMEOVER\n");
    }
  }

  document.getElementById("gameStartMsg").style.display="block";

  document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
      const port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });

      document.getElementById('connectBtn').innerText = "🔌 מחובר!";
      document.getElementById('connectBtn').style.backgroundColor = "lightgreen";

      const textEncoder = new TextEncoderStream();
      const writableStreamClosed = textEncoder.readable.pipeTo(port.writable);
      writer = textEncoder.writable.getWriter();

      const textDecoder = new TextDecoderStream();
      const readableStreamClosedDecoder = port.readable.pipeTo(textDecoder.writable);
      const reader = textDecoder.readable.getReader();

      while (true) {
        const { value, done } = await reader.read();
        if (done) {
          reader.releaseLock();
          break;
        }
        if (value) {
          const command = value.trim();
          if (command === "UP")    SetDirection("up");
          if (command === "DOWN")  SetDirection("down");

          if (command === "LEFT")  SetDirection("right");
          if (command === "RIGHT") SetDirection("left");

          if (command === "GREEN" && document.getElementById("gameStartMsg").style.display !== "none") {
            startNewGame();
          }
        }
      }
    } catch (error) {
      console.error(error);
    }
  });
</script>
</body>
</html>
