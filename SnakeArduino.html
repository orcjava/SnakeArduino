<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake Game</title>
  <style>
    body{
      direction: ltr;
      font-family: Arial, sans-serif;
      font-size: 30px;
      color: white;
      background: linear-gradient(135deg, #17143a, #30206b, #162b4d);
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .greenText{
      background-color: rgba(31, 41, 55, 0.9);
      width: 80%;
      margin: 30px auto;
      padding: 10px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    .gridPanel{
      width: 180px;
      margin: 0;
      background-color: rgba(31, 41, 55, 0.95);
      border-radius: 10px;
      padding: 10px;
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(4,1fr);
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    .fullLine{
      grid-column: 2/span 2;
    }
    .halfLine1{
      grid-column: 1/span 2;
    }
    .halfLine2{
      grid-column: 3/span 2;
    }
    .gridPanel button{
      font-size: 18px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #4f46e5;
      color: white;
      cursor: pointer;
    }
    .gridPanel button:hover{
      background-color: #6366f1;
    }
    #scorePanel{
      width: 100px;
      margin: 20px auto;
      font-size: 40px;
      background-color: rgba(31, 41, 55, 0.9);
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }
    .gameArea{
      position: relative;
      width: 608px;
      margin: 20px auto;
    }
    #gameBoard{
      margin: 0;
      width: 600px;
      display: grid;
      grid-template-columns: repeat(20,30px);
      grid-template-rows: repeat(20,30px);
      background-color: #111827;
      border: 4px solid #6366f1;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(99,102,241,0.5);
      overflow: hidden;
    }
    .buttonsPanel{
      position: absolute;
      right: calc(100% + 30px);
      top: 50%;
      transform: translateY(-50%);
    }
    #gameBoard div{
      border: 1px solid #1f2937;
    }
    .food{
      background-color: #f43f5e;
      border-radius: 50%;
      box-shadow: 0 0 10px #f43f5e;
    }
    .snake{
      background-color: #38bdf8;
      border-radius: 6px;
      box-shadow: 0 0 6px #38bdf8;
    }
    .snakeHead{
      background-color: #a855f7;
      border-radius: 8px;
      box-shadow: 0 0 15px #a855f7;
      position: relative;
    }
    .snakeHead::before,
    .snakeHead::after{
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: white;
      border-radius: 50%;
      top: 5px;
    }
    .snakeHead::before{
      left: 5px;
    }
    .snakeHead::after{
      right: 5px;
    }
  </style>
</head>
<body>
<h1 class="greenText">
  Snake Game
</h1>
<div class="greenText" id="gameStartMsg">
  Press the button to start the game
  <br />
  <button onclick="startNewGame();">
    Start New Game
  </button>
</div>
<div id="scorePanel">0</div>
<div class="gameArea">
  <div class="buttonsPanel gridPanel">
    <button class="fullLine" onclick="SetDirection('up');">Up</button>
    <button class="halfLine1" onclick="SetDirection('left');">Left</button>
    <button class="halfLine2" onclick="SetDirection('right');">Right</button>
    <button class="fullLine" onclick="SetDirection('down');">Down</button>
  </div>
  <div id="gameBoard"></div>
</div>
<script>
  let score = 0;
  let removeTailCnt=0;
  const CellValues={
    EMPTY:0,
    FOOD:5,
    SNAKE:2,
    SNAKE_HEAD:4,
  }
  let direction="right";
  let numOfCols=20;
  let numOfRows=20;
  let timeId;
  let gameOver=false;
  let snake;
  let board=[];
  function startNewGame(){
    score = 0;
    removeTailCnt=0;
    direction="right";
    gameOver=false;
    board=[];
    createBoard();
    InitSnake();
    AddFood();
    showBoardWithDiv();

    document.getElementById("gameStartMsg").style.display="none";
    timeId = setTimeout(move,500)
  }
  function createBoard(){
    for(let i=0;i<numOfRows;i++){
      board[i]=[];
      for(let j=0;j<numOfCols;j++){
        board[i].push(CellValues.EMPTY);
      }
    }
  }
  function AddFood(){
    let row,col;
    do {
      col = Math.floor(Math.random() * numOfCols);
      row = Math.floor(Math.random() * numOfRows);
    }while(board[row][col] !== CellValues.EMPTY);
    board[row][col]=CellValues.FOOD;
  }
  function showBoardWithDiv(){
    let brd=document.getElementById("gameBoard");
    brd.innerHTML="";
    for(let r=0;r<numOfRows;r++){
      for(let c=0;c<numOfCols;c++){
        let el=document.createElement("div");
        switch (board[r][c]) {
          case CellValues.SNAKE:      el.classList.add("snake");      break;
          case CellValues.SNAKE_HEAD: el.classList.add("snakeHead");  break;
          case CellValues.FOOD:       el.classList.add("food");       break;
        }
        brd.appendChild(el);
      }
    }
  }
  function InitSnake(){
    board[5][2]=CellValues.SNAKE_HEAD;
    board[5][1]=CellValues.SNAKE;
    board[5][0]=CellValues.SNAKE;
    snake=
            [
              {r:5,c:2},
              {r:5,c:1},
              {r:5,c:0}
            ];
  }
  function FoodEaten(){
    removeTailCnt=3;
    score+=10;
    AddFood();
    document.getElementById("scorePanel").innerHTML=score;
  }
  function GenStep(newRow,newCol,head){
    if (board[newRow][newCol]===CellValues.FOOD) {
      FoodEaten();
    }
    if (removeTailCnt === 0){
      let tail = snake.pop();
      board[tail.r][tail.c] = CellValues.EMPTY;
    } else {
      removeTailCnt--;
    }
    if ((board[newRow][newCol]===CellValues.SNAKE)||
            (board[newRow][newCol]===CellValues.SNAKE_HEAD)){
      endGame();
      return;
    }
    snake.unshift({r:newRow,c:newCol});
    board[newRow][newCol]=CellValues.SNAKE_HEAD
    board[head.r][head.c]=CellValues.SNAKE;
  }
  function moveLeft(){
    let head=snake[0];
    let newCol=head.c-1;
    let newRow=head.r;
    if (newCol < 0) {
      endGame();
      return;
    }
    GenStep(newRow,newCol,head);
  }
  function moveRight(){
    let head=snake[0];
    let newCol=head.c+1;
    let newRow=head.r;
    if (newCol>=numOfCols) {
      endGame();
      return;
    }
    GenStep(newRow,newCol,head);
  }
  function moveUp(){
    let head=snake[0];
    let newCol=head.c;
    let newRow=head.r-1;
    if (newRow < 0) {
      endGame();
      return;
    }
    GenStep(newRow,newCol,head);
  }
  function moveDown(){
    let head=snake[0];
    let newCol=head.c;
    let newRow=head.r+1;
    if (newRow >= numOfRows) {
      endGame();
      return;
    }
    GenStep(newRow,newCol,head);
  }
  function move(){
    switch (direction) {
      case "up":    moveUp();     break;
      case "right": moveRight();  break;
      case "left":  moveLeft();   break;
      case "down":  moveDown();   break;
    }
    showBoardWithDiv();
    if (!gameOver) {
      timeId = setTimeout(move, 500)
    }
  }
  function SetDirection(newDirection){
    direction=newDirection;
  }
  function endGame(){
    document.getElementById("gameStartMsg").style.display="block";
    clearTimeout(timeId);
    gameOver=true;
  }
  document.getElementById("gameStartMsg").style.display="block";
</script>
</body>
</html>
