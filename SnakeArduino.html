<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake Game</title>
  <style>
    body{
      direction: ltr;
      font-family: Arial, sans-serif;
      font-size: 22px;
      color: white;
      background: linear-gradient(135deg, #17143a, #30206b, #162b4d);
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .greenText{
      background-color: rgba(31, 41, 55, 0.9);
      width: 80%;
      margin: 12px auto;
      padding: 8px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    h1.greenText{
      font-size: 42px;
      margin-top: 12px;
      margin-bottom: 12px;
    }
    #gameStartMsg{
      font-size: 20px;
    }
    #gameStartMsg button,
    #gameOverMsg button{
      font-size: 16px;
      padding: 7px 12px;
      border: none;
      border-radius: 8px;
      background-color: #4f46e5;
      color: white;
      cursor: pointer;
      margin-top: 6px;
    }
    #gameStartMsg button:hover,
    #gameOverMsg button:hover{
      background-color: #6366f1;
    }
    #scorePanel{
      width: 300px;
      margin: 12px auto;
      font-size: 20px;
      background: rgba(31, 41, 55, 0.9);
      padding: 12px 14px;
      border: 1px solid rgba(129, 140, 248, 0.45);
      border-radius: 12px;
      box-shadow: 0 0 18px rgba(99, 102, 241, 0.25);
    }
    #scorePanel span{
      display: inline-block;
      min-width: 28px;
      color: #a5f3fc;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.35);
    }
    .gameArea{
      width: 508px;
      margin: 12px auto;
    }
    #gameBoard{
      margin: 0;
      width: 500px;
      display: grid;
      grid-template-columns: repeat(20,25px);
      grid-template-rows: repeat(20,25px);
      background-color: #111827;
      border: 4px solid #6366f1;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(99,102,241,0.5);
      overflow: hidden;
    }
    #gameBoard div{
      border: 1px solid #1f2937;
    }
    .food{
      background-color: #f43f5e;
      border-radius: 50%;
      box-shadow: 0 0 10px #f43f5e;
      animation: foodPulse 1s ease-in-out infinite alternate;
    }
    @keyframes foodPulse{
      from{
        box-shadow: 0 0 5px #f43f5e;
        transform: scale(0.85);
      }
      to{
        box-shadow: 0 0 15px #fb7185;
        transform: scale(1);
      }
    }
    .snake{
      background-color: #38bdf8;
      border-radius: 6px;
      box-shadow: 0 0 6px #38bdf8;
    }
    .snakeHead{
      background-color: #a855f7;
      border-radius: 8px;
      box-shadow: 0 0 15px #a855f7;
      position: relative;
    }
    .snakeHead::before,
    .snakeHead::after{
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: white;
      border-radius: 50%;
      top: 5px;
    }
    .snakeHead::before{
      left: 5px;
    }
    .snakeHead::after{
      right: 5px;
    }
    /* Show Game Over above the game without moving the board */
    #gameOverMsg{
      display: none;
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(127, 29, 29, 0.97);
      width: 360px;
      max-width: 85vw;
      box-sizing: border-box;
      margin: 0;
      padding: 12px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(239,68,68,0.5);
    }
    #gameOverMsg h2{
      margin: 0 0 8px 0;
      color: #fca5a5;
      font-size: 32px;
    }
    #gameOverMsg p{
      margin: 8px;
      font-size: 20px;
    }
    #connectArduino{
      font-size: 16px;
      padding: 7px 12px;
      border: none;
      border-radius: 8px;
      background-color: #059669;
      color: white;
      cursor: pointer;
      margin: 6px 4px 0;
    }
    #connectArduino:hover{
      background-color: #10b981;
    }
    #connectionStatus{
      font-size: 15px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
<h1 class="greenText">
  Snake Game
</h1>
<div class="greenText" id="gameStartMsg">
  Press the red or green button to start the game
  <br />
  <br />
  <button onclick="startNewGame();">
    Start New Game
  </button>
  <button id="connectArduino" onclick="connectArduino();">
    Connect Arduino
  </button>
  <div id="connectionStatus">
    Arduino not connected
  </div>
</div>
<div id="gameOverMsg">
  <h2>GAME OVER</h2>
  <p>Your Score: <span id="finalScore">0</span></p>
  <p>Best Score: <span id="bestScore">0</span></p>
  <p>Press the red or green button to start a new game</p>
  <button onclick="startNewGame();">
    Start New Game
  </button>
</div>
<div id="scorePanel">
  Score: <span id="score">0</span>
  &nbsp;&nbsp;
  Best: <span id="best">0</span>
</div>
<div class="gameArea">
  <div id="gameBoard"></div>
</div>
<script>
  // Game settings and score
  let score = 0;
  let bestScore = 0;
  let speed = 500;
  let removeTailCnt=0;
  const CellValues={
    EMPTY:0,
    FOOD:5,
    SNAKE:2,
    SNAKE_HEAD:4,
  }
  // Current direction and board settings
  let direction="right";
  let directionChanged=false;
  let numOfCols=20;
  let numOfRows=20;
  let timeId;
  let gameOver=false;
  let snake;
  let board=[];

  // Serial connection and shared audio context
  let serialPort = null;
  let serialWriter = null;
  let audio = null;

  // Connect to Arduino through the browser
  async function connectArduino(){
    if (!("serial" in navigator)){
      document.getElementById("connectionStatus").innerHTML="Web Serial is not supported in this browser";
      return;
    }
    try{
      serialPort = await navigator.serial.requestPort();
      await serialPort.open({baudRate: 9600});
      serialWriter = serialPort.writable.getWriter();
      document.getElementById("connectionStatus").innerHTML="Arduino connected";
    }
    catch(error){
      document.getElementById("connectionStatus").innerHTML="Arduino connection failed";
    }
  }

  // Send game events to Arduino
  async function sendToArduino(message){
    if(serialWriter === null){
      return;
    }
    const data = new TextEncoder().encode(message + "\n");
    await serialWriter.write(data);
  }

  // Reuse one audio context for faster sound playback
  function getAudioContext(){
    if(audio === null){
      audio = new AudioContext();
    }
    if(audio.state === "suspended"){
      audio.resume();
    }
    return audio;
  }

  // Play a short sound when the snake eats food
  function playFoodSound(){
    const audioContext = getAudioContext();
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.type = "sine";
    oscillator.frequency.value = 700;

    gain.gain.setValueAtTime(0.2, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.15);
  }

  // Play a low sound when the game ends
  function playGameOverSound(){
    const audioContext = getAudioContext();
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.type = "triangle";
    oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.5);

    gain.gain.setValueAtTime(0.25, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.5);
  }

  // Reset the game and create a new snake
  function startNewGame(){
    getAudioContext();
    clearTimeout(timeId);
    timeId=null;
    score = 0;
    speed = 500;
    removeTailCnt=0;
    direction="right";
    directionChanged=false;
    gameOver=false;
    board=[];
    document.getElementById("score").innerHTML=score;
    document.getElementById("gameStartMsg").style.display="none";
    document.getElementById("gameOverMsg").style.display="none";
    createBoard();
    InitSnake();
    AddFood();
    showBoardWithDiv();
    timeId = setTimeout(move,speed)
  }

  // Fill the board with empty cells
  function createBoard(){
    for(let i=0;i<numOfRows;i++){
      board[i]=[];
      for(let j=0;j<numOfCols;j++){
        board[i].push(CellValues.EMPTY);
      }
    }
  }

  // Place food in a random empty cell
  function AddFood(){
    let row,col;
    do {
      col = Math.floor(Math.random() * numOfCols);
      row = Math.floor(Math.random() * numOfRows);
    }while(board[row][col] !== CellValues.EMPTY);
    board[row][col]=CellValues.FOOD;
  }

  // Draw the board using HTML elements
  function showBoardWithDiv(){
    let brd=document.getElementById("gameBoard");
    brd.innerHTML="";
    for(let r=0;r<numOfRows;r++){
      for(let c=0;c<numOfCols;c++){
        let el=document.createElement("div");
        switch (board[r][c]) {
          case CellValues.SNAKE:      el.classList.add("snake");      break;
          case CellValues.SNAKE_HEAD: el.classList.add("snakeHead");  break;
          case CellValues.FOOD:       el.classList.add("food");       break;
        }
        brd.appendChild(el);
      }
    }
  }

  // Create the snake at its starting position
  function InitSnake(){
    board[5][2]=CellValues.SNAKE_HEAD;
    board[5][1]=CellValues.SNAKE;
    board[5][0]=CellValues.SNAKE;
    snake=
            [
              {r:5,c:2},
              {r:5,c:1},
              {r:5,c:0}
            ];
  }

  // Update the score when food is eaten
  function FoodEaten(){
    removeTailCnt=3;
    score+=10;
    if(score % 30 === 0 && speed > 150){
      speed -= 50;
    }
    AddFood();
    document.getElementById("score").innerHTML=score;
    playFoodSound();
    sendToArduino("FOOD");
  }

  // Move the snake one cell and check for collisions
  function GenStep(newRow,newCol,head){
    if (board[newRow][newCol]===CellValues.FOOD) {
      FoodEaten();
    }
    if (removeTailCnt === 0){
      let tail = snake.pop();
      board[tail.r][tail.c] = CellValues.EMPTY;
    } else {
      removeTailCnt--;
    }
    if ((board[newRow][newCol]===CellValues.SNAKE)||
            (board[newRow][newCol]===CellValues.SNAKE_HEAD)){
      endGame();
      return;
    }
    snake.unshift({r:newRow,c:newCol});
    board[newRow][newCol]=CellValues.SNAKE_HEAD
    board[head.r][head.c]=CellValues.SNAKE;
  }

  // Calculate the next cell when moving left
  function moveLeft(){
    let head=snake[0];
    let newCol=head.c-1;
    let newRow=head.r;
    if (newCol < 0) {
      endGame();
      return;
    }
    GenStep(newRow,newCol,head);
  }

  // Calculate the next cell when moving right
  function moveRight(){
    let head=snake[0];
    let newCol=head.c+1;
    let newRow=head.r;
    if (newCol>=numOfCols) {
      endGame();
      return;
    }
    GenStep(newRow,newCol,head);
  }

  // Calculate the next cell when moving up
  function moveUp(){
    let head=snake[0];
    let newCol=head.c;
    let newRow=head.r-1;
    if (newRow < 0) {
      endGame();
      return;
    }
    GenStep(newRow,newCol,head);
  }

  // Calculate the next cell when moving down
  function moveDown(){
    let head=snake[0];
    let newCol=head.c;
    let newRow=head.r+1;
    if (newRow >= numOfRows) {
      endGame();
      return;
    }
    GenStep(newRow,newCol,head);
  }

  // Move the snake and schedule the next step
  function move(){
    if(gameOver){
      return;
    }
    switch (direction) {
      case "up":    moveUp();     break;
      case "right": moveRight();  break;
      case "left":  moveLeft();   break;
      case "down":  moveDown();   break;
    }
    if(gameOver){
      return;
    }
    showBoardWithDiv();
    directionChanged=false;
    timeId = setTimeout(move,speed)
  }

  // Allow one turn per step and block reverse movement
  function SetDirection(newDirection){
    if(directionChanged){
      return;
    }
    if(direction==="right" && newDirection==="left"){
      return;
    }
    if(direction==="left" && newDirection==="right"){
      return;
    }
    if(direction==="up" && newDirection==="down"){
      return;
    }
    if(direction==="down" && newDirection==="up"){
      return;
    }
    if(direction!==newDirection){
      direction=newDirection;
      directionChanged=true;
    }
  }

  // Stop the game and update the best score
  function endGame(){
    if(gameOver){
      return;
    }
    if(score > bestScore){
      bestScore = score;
    }
    document.getElementById("finalScore").innerHTML=score;
    document.getElementById("bestScore").innerHTML=bestScore;
    document.getElementById("best").innerHTML=bestScore;
    document.getElementById("gameStartMsg").style.display="none";
    document.getElementById("gameOverMsg").style.display="block";
    clearTimeout(timeId);
    timeId=null;
    gameOver=true;
    playGameOverSound();
    sendToArduino("GAMEOVER");
  }

  // Use keyboard arrows and Enter to control the game
  document.addEventListener("keydown",function(event){
    if(event.key==="ArrowUp"){
      event.preventDefault();
      SetDirection("up");
    }
    if(event.key==="ArrowDown"){
      event.preventDefault();
      SetDirection("down");
    }
    if(event.key==="ArrowLeft"){
      event.preventDefault();
      SetDirection("left");
    }
    if(event.key==="ArrowRight"){
      event.preventDefault();
      SetDirection("right");
    }
    if(event.key==="Enter"){
      event.preventDefault();
      if(gameOver || document.getElementById("gameStartMsg").style.display!=="none"){
        startNewGame();
      }
    }
  });

  // Show the start screen when the page opens
  document.getElementById("gameStartMsg").style.display="block";
</script>
</body>
</html>
